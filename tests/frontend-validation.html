<!DOCTYPE html>
<html lang="zh-CN">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>前端页面验证</title>
    <script>
        // 捕获所有console输出
        const logs = [];
        const originalLog = console.log;
        const originalError = console.error;
        const originalWarn = console.warn;

        console.log = function (...args) {
            logs.push({ type: 'log', message: args.join(' '), time: new Date() });
            originalLog.apply(console, args);
        };

        console.error = function (...args) {
            logs.push({ type: 'error', message: args.join(' '), time: new Date() });
            originalError.apply(console, args);
        };

        console.warn = function (...args) {
            logs.push({ type: 'warn', message: args.join(' '), time: new Date() });
            originalWarn.apply(console, args);
        };

        // 在页面加载完成后显示日志
        window.addEventListener('load', () => {
            setTimeout(() => {
                const reportDiv = document.getElementById('console-report');
                reportDiv.innerHTML = '<h2>控制台输出</h2>';

                logs.forEach(log => {
                    const logDiv = document.createElement('div');
                    logDiv.className = `log-${log.type}`;
                    logDiv.textContent = `[${log.time.toLocaleTimeString()}] [${log.type.toUpperCase()}] ${log.message}`;
                    reportDiv.appendChild(logDiv);
                });

                // 显示页面状态
                const statusDiv = document.createElement('div');
                statusDiv.className = 'status';
                statusDiv.innerHTML = `
                    <h3>页面状态</h3>
                    <p>错误数: ${logs.filter(l => l.type === 'error').length}</p>
                    <p>警告数: ${logs.filter(l => l.type === 'warn').length}</p>
                    <p>日志数: ${logs.filter(l => l.type === 'log').length}</p>
                `;
                reportDiv.insertBefore(statusDiv, reportDiv.firstChild);
            }, 3000); // 等待3秒让页面完全加载
        });
    </script>
    <style>
        body {
            font-family: 'Courier New', monospace;
            padding: 20px;
            background: #1e1e1e;
            color: #d4d4d4;
        }

        #console-report {
            margin-top: 20px;
        }

        .log-error {
            color: #f48771;
            background: #5a1a1a;
            padding: 5px;
            margin: 2px 0;
            border-left: 3px solid #f48771;
        }

        .log-warn {
            color: #dcdcaa;
            background: #5a5a1a;
            padding: 5px;
            margin: 2px 0;
            border-left: 3px solid #dcdcaa;
        }

        .log-log {
            color: #4fc1ff;
            padding: 5px;
            margin: 2px 0;
        }

        .status {
            background: #2d2d30;
            padding: 10px;
            border-radius: 5px;
            margin-bottom: 20px;
        }

        iframe {
            width: 100%;
            height: 600px;
            border: 2px solid #3c3c3c;
            margin-top: 20px;
        }
    </style>
</head>

<body>
    <h1>WebGIS 前端页面验证</h1>
    <div id="console-report">正在加载页面...</div>
    <iframe src="http://localhost:5176/" title="WebGIS Application"></iframe>
</body>

</html>
