<!DOCTYPE html>
<html>

<head>
    <title>API Test via Vite Proxy</title>
</head>

<body>
    <h1>API Test Page (via Vite Proxy)</h1>
    <button onclick="testViaProxy()">Test /api/clcd/test (via Vite)</button>
    <button onclick="testSummaryViaProxy()">Test /api/clcd/2023/summary (via Vite)</button>
    <button onclick="testDirect()">Test Direct to 5174</button>
    <pre id="result"></pre>

    <script>
        async function testViaProxy() {
            const result = document.getElementById('result');
            try {
                result.textContent = 'Loading via Vite proxy...';
                // This will go through Vite proxy (localhost:5173/api -> localhost:5174/api)
                const response = await fetch('/api/clcd/test');
                const text = await response.text();
                result.textContent = `Status: ${response.status}\nVia Proxy:\n${text}`;
            } catch (err) {
                result.textContent = `Error: ${err.message}\nStack: ${err.stack}`;
            }
        }

        async function testSummaryViaProxy() {
            const result = document.getElementById('result');
            try {
                result.textContent = 'Loading via Vite proxy...';
                const response = await fetch('/api/clcd/2023/summary');
                const text = await response.text();
                result.textContent = `Status: ${response.status}\nVia Proxy:\n${text}`;
            } catch (err) {
                result.textContent = `Error: ${err.message}`;
            }
        }

        async function testDirect() {
            const result = document.getElementById('result');
            try {
                result.textContent = 'Loading direct...';
                const response = await fetch('http://localhost:5174/api/clcd/test');
                const text = await response.text();
                result.textContent = `Status: ${response.status}\nDirect:\n${text}`;
            } catch (err) {
                result.textContent = `Error: ${err.message}`;
            }
        }
    </script>
</body>

</html>
