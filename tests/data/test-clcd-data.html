<!DOCTYPE html>
<html lang="zh-CN">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CLCD数据优化测试</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #1e3c72 0%, #2a5298 100%);
            color: #ffffff;
            padding: 20px;
            min-height: 100vh;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
        }

        h1 {
            text-align: center;
            margin-bottom: 30px;
            font-size: 28px;
            text-shadow: 2px 2px 4px rgba(0, 0, 0, 0.3);
        }

        .test-section {
            background: rgba(255, 255, 255, 0.1);
            border-radius: 12px;
            padding: 20px;
            margin-bottom: 20px;
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.2);
        }

        .test-section h2 {
            font-size: 20px;
            margin-bottom: 15px;
            color: #9cc9ff;
            border-bottom: 2px solid rgba(156, 201, 255, 0.3);
            padding-bottom: 8px;
        }

        .status {
            display: inline-block;
            padding: 4px 12px;
            border-radius: 4px;
            font-size: 12px;
            font-weight: bold;
            margin-left: 10px;
        }

        .status.success {
            background: #4caf50;
            color: white;
        }

        .status.error {
            background: #f44336;
            color: white;
        }

        .status.loading {
            background: #ff9800;
            color: white;
        }

        .data-display {
            background: rgba(0, 0, 0, 0.3);
            border-radius: 8px;
            padding: 15px;
            margin-top: 10px;
            font-family: 'Courier New', monospace;
            font-size: 14px;
            max-height: 300px;
            overflow-y: auto;
            white-space: pre-wrap;
            word-wrap: break-word;
        }

        .controls {
            margin-top: 10px;
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
        }

        button {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            padding: 10px 20px;
            border-radius: 6px;
            cursor: pointer;
            font-size: 14px;
            font-weight: 500;
            transition: all 0.3s ease;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.2);
        }

        button:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 12px rgba(0, 0, 0, 0.3);
        }

        button:active {
            transform: translateY(0);
        }

        select,
        input {
            padding: 8px 12px;
            border-radius: 6px;
            border: 1px solid rgba(255, 255, 255, 0.3);
            background: rgba(255, 255, 255, 0.1);
            color: white;
            font-size: 14px;
        }

        .stats-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 15px;
            margin-top: 15px;
        }

        .stat-card {
            background: rgba(0, 0, 0, 0.3);
            padding: 15px;
            border-radius: 8px;
            text-align: center;
        }

        .stat-value {
            font-size: 24px;
            font-weight: bold;
            color: #9cc9ff;
            margin-bottom: 5px;
        }

        .stat-label {
            font-size: 12px;
            color: rgba(255, 255, 255, 0.7);
        }

        .loading-spinner {
            display: inline-block;
            width: 16px;
            height: 16px;
            border: 3px solid rgba(255, 255, 255, 0.3);
            border-top-color: white;
            border-radius: 50%;
            animation: spin 1s linear infinite;
            margin-right: 8px;
            vertical-align: middle;
        }

        @keyframes spin {
            0% {
                transform: rotate(0deg);
            }

            100% {
                transform: rotate(360deg);
            }
        }
    </style>
</head>

<body>
    <div class="container">
        <h1>🌏 CLCD数据优化测试页面</h1>

        <!-- 测试1: 配置文件加载 -->
        <div class="test-section">
            <h2>1. 土地利用类型配置 <span id="config-status" class="status loading">未加载</span></h2>
            <button onclick="testLoadConfig()">加载配置文件</button>
            <div id="config-result" class="data-display" style="display: none;"></div>
        </div>

        <!-- 测试2: 省级数据加载 -->
        <div class="test-section">
            <h2>2. 省级数据 <span id="province-status" class="status loading">未加载</span></h2>
            <div class="controls">
                <button onclick="testLoadProvinceData()">加载全部省级数据</button>
                <select id="year-select">
                    <option value="1985">1985年</option>
                    <option value="2000">2000年</option>
                    <option value="2010">2010年</option>
                    <option value="2020">2020年</option>
                    <option value="2023" selected>2023年</option>
                </select>
                <button onclick="testLoadProvinceByYear()">按年份加载</button>
            </div>
            <div id="province-stats" class="stats-grid" style="display: none;"></div>
            <div id="province-result" class="data-display" style="display: none;"></div>
        </div>

        <!-- 测试3: 地级市数据加载 -->
        <div class="test-section">
            <h2>3. 地级市数据 <span id="prefecture-status" class="status loading">未加载</span></h2>
            <div class="controls">
                <button onclick="testLoadPrefectureData()">加载全部地级市数据</button>
            </div>
            <div id="prefecture-stats" class="stats-grid" style="display: none;"></div>
            <div id="prefecture-result" class="data-display" style="display: none;"></div>
        </div>

        <!-- 测试4: 县级数据统计 -->
        <div class="test-section">
            <h2>4. 县级数据 <span id="county-status" class="status loading">未加载</span></h2>
            <div class="controls">
                <button onclick="testLoadCountyData()">加载县级数据统计</button>
            </div>
            <div id="county-stats" class="stats-grid" style="display: none;"></div>
        </div>
    </div>

    <script type="module">
        // 数据加载函数
        window.testLoadConfig = async function () {
            const statusEl = document.getElementById('config-status');
            const resultEl = document.getElementById('config-result');

            statusEl.innerHTML = '<span class="loading-spinner"></span>加载中';
            statusEl.className = 'status loading';

            try {
                const response = await fetch('/data/land_use_config.json');
                if (!response.ok) throw new Error(`HTTP ${response.status}`);

                const config = await response.json();

                resultEl.textContent = JSON.stringify(config, null, 2);
                resultEl.style.display = 'block';

                statusEl.textContent = '✓ 成功';
                statusEl.className = 'status success';

                console.log('配置加载成功:', config);
            } catch (error) {
                statusEl.textContent = '✗ 失败';
                statusEl.className = 'status error';
                resultEl.textContent = `错误: ${error.message}`;
                resultEl.style.display = 'block';
                console.error('配置加载失败:', error);
            }
        };

        window.testLoadProvinceData = async function () {
            const statusEl = document.getElementById('province-status');
            const resultEl = document.getElementById('province-result');
            const statsEl = document.getElementById('province-stats');

            statusEl.innerHTML = '<span class="loading-spinner"></span>加载中';
            statusEl.className = 'status loading';

            try {
                const response = await fetch('/data/clcd_province.json');
                if (!response.ok) throw new Error(`HTTP ${response.status}`);

                const data = await response.json();

                // 显示统计信息
                const years = [...new Set(data.map(d => d.year))];
                statsEl.innerHTML = `
          <div class="stat-card">
            <div class="stat-value">${data.length}</div>
            <div class="stat-label">总记录数</div>
          </div>
          <div class="stat-card">
            <div class="stat-value">${years.length}</div>
            <div class="stat-label">年份数量</div>
          </div>
          <div class="stat-card">
            <div class="stat-value">${years[0]}-${years[years.length - 1]}</div>
            <div class="stat-label">年份范围</div>
          </div>
        `;
                statsEl.style.display = 'grid';

                resultEl.textContent = JSON.stringify(data.slice(0, 3), null, 2) + '\n... (仅显示前3条)';
                resultEl.style.display = 'block';

                statusEl.textContent = '✓ 成功';
                statusEl.className = 'status success';

                console.log('省级数据加载成功:', data);
            } catch (error) {
                statusEl.textContent = '✗ 失败';
                statusEl.className = 'status error';
                console.error('省级数据加载失败:', error);
            }
        };

        window.testLoadProvinceByYear = async function () {
            const year = parseInt(document.getElementById('year-select').value);
            const resultEl = document.getElementById('province-result');

            try {
                const response = await fetch('/data/clcd_province.json');
                if (!response.ok) throw new Error(`HTTP ${response.status}`);

                const data = await response.json();
                const yearData = data.find(d => d.year === year);

                if (yearData) {
                    resultEl.textContent = JSON.stringify(yearData, null, 2);
                    resultEl.style.display = 'block';
                    console.log(`${year}年数据:`, yearData);
                } else {
                    resultEl.textContent = `未找到${year}年的数据`;
                    resultEl.style.display = 'block';
                }
            } catch (error) {
                console.error('加载失败:', error);
            }
        };

        window.testLoadPrefectureData = async function () {
            const statusEl = document.getElementById('prefecture-status');
            const resultEl = document.getElementById('prefecture-result');
            const statsEl = document.getElementById('prefecture-stats');

            statusEl.innerHTML = '<span class="loading-spinner"></span>加载中';
            statusEl.className = 'status loading';

            try {
                const response = await fetch('/data/clcd_prefecture.json');
                if (!response.ok) throw new Error(`HTTP ${response.status}`);

                const data = await response.json();

                const cities = [...new Set(data.map(d => d.region_name))];
                const years = [...new Set(data.map(d => d.year))];

                statsEl.innerHTML = `
          <div class="stat-card">
            <div class="stat-value">${data.length}</div>
            <div class="stat-label">总记录数</div>
          </div>
          <div class="stat-card">
            <div class="stat-value">${cities.length}</div>
            <div class="stat-label">地级市数量</div>
          </div>
          <div class="stat-card">
            <div class="stat-value">${years.length}</div>
            <div class="stat-label">年份数</div>
          </div>
        `;
                statsEl.style.display = 'grid';

                resultEl.textContent = `地级市列表: ${cities.join(', ')}`;
                resultEl.style.display = 'block';

                statusEl.textContent = '✓ 成功';
                statusEl.className = 'status success';

                console.log('地级市数据加载成功:', data);
            } catch (error) {
                statusEl.textContent = '✗ 失败';
    </script>
</body>

</html>
