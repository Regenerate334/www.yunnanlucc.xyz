# ========================================================
# WebGIS 项目 - 生产环境 Nginx PRO MAX 优化版 (Windows版)
# ========================================================

# 工作进程数，Windows 环境下建议设为 1
worker_processes  1;

events {
    worker_connections  1024;
}

http {
    include       "C:/projects/webgis/my_webgis_project/ops/sys/nginx/mime.types";
    default_type  application/octet-stream;

    # 1. 基础性能优化 (Transmission Layer Pro Max)
    sendfile        on;
    tcp_nopush      on;
    tcp_nodelay     on;
    keepalive_timeout  65;

    # 安全增强 (Security Pro Max)
    server_tokens off;          # 隐藏 Nginx 版本号
    add_header X-Frame-Options "SAMEORIGIN"; # 防止点击劫持
    add_header X-XSS-Protection "1; mode=block"; # 浏览器 XSS 防护
    add_header X-Content-Type-Options "nosniff"; # 防止类型嗅探

    # 强力 Gzip 压缩
    gzip  on;
    gzip_min_length 1k;
    gzip_comp_level 6;      # 压缩与 CPU 的平衡点
    gzip_proxied any;
    gzip_vary on;
    
    # 增加 GIS 专用 MIME 类型支持
    gzip_types 
        text/plain 
        text/css 
        application/json 
        application/javascript 
        text/xml 
        application/xml 
        application/xml+rss 
        text/javascript
        application/geo+json               # GeoJSON
        application/vnd.google-earth.kml+xml # KML
        application/vnd.mapbox-vector-tile   # MVT (Vector Tiles)
        application/x-protobuf;            # Protobuf (MVT 基础)

    server {
        listen       80;
        server_name  localhost; 

        # 1. 前端页面（静态托管模式）
        location / {
            root   "C:/projects/webgis/my_webgis_project/dist"; 
            index  index.html index.htm;
            
            # 核心配置：防止单页面应用 (SPA) 刷新后 404
            try_files $uri $uri/ /index.html;

            # 对静态资源开启浏览器强缓存 (除了 index.html 和 JS/CSS 映射)
            location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff2?|webp)$ {
                root "C:/projects/webgis/my_webgis_project/dist";
                expires 30d;
                add_header Cache-Control "public, no-transform";
                access_log off;
            }
        }

        # 2. GeoServer 地图服务代理 (优化切片传输)
        # 禁止从外网访问 GeoServer 管理后台 (Security Pro Max)
        location ^~ /geoserver/web/ {
            deny all;
        }

        location /geoserver {
            proxy_pass http://127.0.0.1:8080/geoserver;
            
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            
            # 开启代理缓冲，提升大尺寸瓦片数据传输稳定性
            proxy_buffering on;
            proxy_buffer_size 128k;
            proxy_buffers 4 256k;
            proxy_busy_buffers_size 256k;
            
            # 重要：自动修正 GeoServer 返回的内部 8080 重定向地址
            proxy_redirect http://127.0.0.1:8080/geoserver/ /geoserver/;
            
            # 针对大地图数据切片的读取超时设置
            proxy_read_timeout 600s;
            proxy_send_timeout 600s;
        }

        # 3. 后端 API 接口代理 (优化 AI 实时流式输出)
        location /api {
            proxy_pass http://127.0.0.1:3000; 
            
            # 重要：禁用代理缓冲以支持 SSE/Stream 流式输出 (实时打字机效果)
            proxy_buffering off;
            proxy_cache off;
            
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            
            # 允许上传较大的 GeoJSON 或模型文件 (如 100MB)
            client_max_body_size 100m; 
            
            # 支持 WebSocket 及流式连接
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
        }

        # 错误页面处理
        error_page   500 502 503 504  /50x.html;
        location = /50x.html {
            root   html;
        }
    }
}
