openapi: 3.0.3
info:
  title: 云南省国土空间规划监测预警平台 API
  description: |
    云南省国土空间规划监测预警系统后端 RESTful API 接口规范。

    ## 认证说明
    除认证接口、天气接口和健康检查外，所有接口均需要 JWT Bearer Token 认证。

    ## 数据来源
    土地利用数据来源于中国土地覆盖数据集 (CLCD)，时间跨度 1985-2023 年，包含 9 种地类。
  version: 1.0.0
  contact:
    name: 开发团队
  license:
    name: MIT

servers:
  - url: http://localhost:3000
    description: 本地开发环境
  - url: https://your-domain.com
    description: 生产环境

externalDocs:
  description: 完整的 Markdown 文档
  url: ./API_DOCUMENTATION.md

tags:
  - name: 健康检查
    description: 服务状态检查
  - name: 用户认证
    description: 用户登录、注册和令牌验证
  - name: 土地利用数据
    description: CLCD 土地利用覆盖数据查询
  - name: 行政区划
    description: 云南省行政区划信息
  - name: 空间分析
    description: 土地转移矩阵和动态度分析
  - name: 气象服务
    description: 天气实况和预报查询
  - name: 智能分析
    description: AI 驱动的数据分析
  - name: 会话管理
    description: 对话会话的增删改查

paths:
  /health:
    get:
      tags: [健康检查]
      summary: 服务健康检查
      description: 检查服务器和数据库连接状态
      responses:
        '200':
          description: 服务正常
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok:
                    type: boolean
                    example: true
                  db:
                    type: boolean
                    example: true

  /api/auth/login:
    post:
      tags: [用户认证]
      summary: 用户登录
      description: 验证用户名和密码，成功后返回 JWT 令牌。令牌有效期 24 小时。
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [username, password]
              properties:
                username:
                  type: string
                  description: 用户名
                  example: admin
                password:
                  type: string
                  format: password
                  description: 密码
                  example: "123456"
      responses:
        '200':
          description: 登录成功
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  token:
                    type: string
                    description: JWT 令牌
                  user:
                    $ref: '#/components/schemas/User'
        '401':
          description: 用户名或密码错误

  /api/auth/register:
    post:
      tags: [用户认证]
      summary: 用户注册
      description: 创建新用户账号，密码使用 bcrypt 加密存储
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [username, password]
              properties:
                username:
                  type: string
                  minLength: 3
                  description: 用户名，至少 3 个字符
                  example: newuser
                password:
                  type: string
                  minLength: 6
                  format: password
                  description: 密码，至少 6 个字符
      responses:
        '201':
          description: 注册成功
        '400':
          description: 用户名已存在或参数校验失败

  /api/auth/verify:
    get:
      tags: [用户认证]
      summary: 验证令牌
      description: 验证 JWT 令牌有效性，返回解码后的用户信息
      security:
        - bearerAuth: []
      responses:
        '200':
          description: 令牌有效
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  user:
                    $ref: '#/components/schemas/User'
        '401':
          description: 令牌无效或已过期

  /api/clcd/years:
    get:
      tags: [土地利用数据]
      summary: 获取可用年份列表
      description: 返回数据集中所有可用年份
      security:
        - bearerAuth: []
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema:
                type: array
                items:
                  type: integer
                example: [1985, 1990, 1995, 2000, 2005, 2010, 2015, 2020, 2023]

  /api/clcd/{year}/summary:
    get:
      tags: [土地利用数据]
      summary: 获取年份汇总数据
      description: 获取指定年份各土地利用类型的面积汇总
      security:
        - bearerAuth: []
      parameters:
        - name: year
          in: path
          required: true
          schema:
            type: integer
          description: 目标年份
          example: 2023
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/LandUseSummary'

  /api/clcd/province:
    get:
      tags: [土地利用数据]
      summary: 获取省级时序数据
      description: 获取云南省所有年份的土地利用数据（宽表格式），面积单位为平方米
      security:
        - bearerAuth: []
      responses:
        '200':
          description: 成功

  /api/clcd/prefecture:
    get:
      tags: [土地利用数据]
      summary: 获取所有地级市数据
      description: 获取云南省 16 个地级市（州）的全量土地利用数据
      security:
        - bearerAuth: []
      responses:
        '200':
          description: 成功

  /api/clcd/county:
    get:
      tags: [土地利用数据]
      summary: 获取所有区县数据
      description: 获取云南省所有区县的全量土地利用数据
      security:
        - bearerAuth: []
      responses:
        '200':
          description: 成功

  /api/clcd/trend/{level}/{name}:
    get:
      tags: [土地利用数据]
      summary: 获取区域趋势数据
      description: 获取指定地级市或区县的历史变化趋势数据
      security:
        - bearerAuth: []
      parameters:
        - name: level
          in: path
          required: true
          schema:
            type: string
            enum: [prefecture, county]
          description: 行政级别
        - name: name
          in: path
          required: true
          schema:
            type: string
          description: 区域名称（需 URL 编码）
          example: 昆明市
      responses:
        '200':
          description: 成功

  /api/clcd/prefecture/name/{name}:
    get:
      tags: [土地利用数据]
      summary: 获取指定地级市时序数据
      security:
        - bearerAuth: []
      parameters:
        - name: name
          in: path
          required: true
          schema:
            type: string
          example: 昆明市
      responses:
        '200':
          description: 成功

  /api/clcd/county/name/{name}:
    get:
      tags: [土地利用数据]
      summary: 获取指定区县时序数据
      security:
        - bearerAuth: []
      parameters:
        - name: name
          in: path
          required: true
          schema:
            type: string
          example: 官渡区
      responses:
        '200':
          description: 成功

  /api/clcd/county/prefecture/{prefecture}:
    get:
      tags: [土地利用数据]
      summary: 获取地级市下属区县数据
      description: 获取某地级市所有下属区县的土地利用数据
      security:
        - bearerAuth: []
      parameters:
        - name: prefecture
          in: path
          required: true
          schema:
            type: string
          example: 昆明市
      responses:
        '200':
          description: 成功

  /api/clcd/prefecture/year/{year}:
    get:
      tags: [土地利用数据]
      summary: 获取指定年份所有地级市数据
      security:
        - bearerAuth: []
      parameters:
        - name: year
          in: path
          required: true
          schema:
            type: integer
          example: 2023
      responses:
        '200':
          description: 成功

  /api/clcd/county/year/{year}:
    get:
      tags: [土地利用数据]
      summary: 获取指定年份所有区县数据
      security:
        - bearerAuth: []
      parameters:
        - name: year
          in: path
          required: true
          schema:
            type: integer
          example: 2023
      responses:
        '200':
          description: 成功

  /api/regions/{level}:
    get:
      tags: [行政区划]
      summary: 获取行政区划列表
      description: 获取行政区划层级结构或名称列表
      security:
        - bearerAuth: []
      parameters:
        - name: level
          in: path
          required: true
          schema:
            type: string
            enum: [hierarchy, prefecture, county]
          description: |
            - hierarchy: 省-市-县树形结构
            - prefecture: 地级市名称数组
            - county: 区县名称数组
      responses:
        '200':
          description: 成功

  /api/analysis/transfer-matrix/periods:
    get:
      tags: [空间分析]
      summary: 获取转移矩阵时间周期
      description: 返回可用于查询转移矩阵的时间周期列表
      security:
        - bearerAuth: []
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema:
                type: array
                items:
                  type: string
                example: ["1990-2000", "2000-2010", "2010-2020", "2020-2023"]

  /api/analysis/transfer-matrix/{period}:
    get:
      tags: [空间分析]
      summary: 获取土地转移矩阵
      description: 获取指定时间段的土地利用转移矩阵（绝对量和百分比）
      security:
        - bearerAuth: []
      parameters:
        - name: period
          in: path
          required: true
          schema:
            type: string
          description: 时间周期
          example: "2010-2020"
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TransferMatrix'

  /api/analysis/dashboard/{year}:
    get:
      tags: [空间分析]
      summary: 获取大屏看板数据
      description: 获取省份汇总、动态度排行榜和预警信息
      security:
        - bearerAuth: []
      parameters:
        - name: year
          in: path
          required: true
          schema:
            type: integer
          example: 2023
        - name: type
          in: query
          schema:
            type: string
            enum: [comprehensive, cropland, forest, grassland, impervious, water]
            default: comprehensive
          description: 动态度计算类型
      responses:
        '200':
          description: 成功

  /api/weather:
    get:
      tags: [气象服务]
      summary: 获取天气数据
      description: 代理高德天气 API，获取实时天气或天气预报
      parameters:
        - name: city
          in: query
          schema:
            type: string
            default: "530100"
          description: 城市行政区划代码
        - name: extensions
          in: query
          schema:
            type: string
            enum: [base, all]
            default: base
          description: base (实况) 或 all (预报)
      responses:
        '200':
          description: 成功

  /api/ai/analyze-stream:
    post:
      tags: [智能分析]
      summary: AI 流式分析
      description: AI 驱动的土地利用数据分析，返回 SSE 流式响应
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [messages]
              properties:
                messages:
                  type: array
                  items:
                    $ref: '#/components/schemas/ChatMessage'
                  description: 对话消息数组
                year:
                  type: integer
                  default: 2023
                  description: 分析年份
                componentContext:
                  type: object
                  properties:
                    type:
                      type: string
                      enum: [province_trend, prefecture_pie, county_pie]
                  description: 组件上下文
                model:
                  type: string
                  enum: ["deepseek-v4-flash", "deepseek-r1:8b", "gemma4:e4b", "gpt-oss:20b"]
                  default: "deepseek-v4-flash"
                  description: AI 模型名称
      responses:
        '200':
          description: SSE 流式响应
          content:
            text/event-stream:
              schema:
                type: string

  /api/report/html:
    post:
      tags: [智能分析]
      summary: 生成专题报告 (Pro Max)
      description: |
        生成高保真、证据驱动的土地利用分析报告。
        支持混合引擎分析（Node.js + Python Data Science）。
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [question]
              properties:
                question:
                  type: string
                  description: 分析问题
                year:
                  type: integer
                  example: 2023
                reportTitle:
                  type: string
                  description: 自定义标题
                chatContext:
                  type: string
                  description: 已有对话历史
      responses:
        '200':
          description: 成功返回 HTML 报告内容或结构化数据

  /api/ai/suggestions:
    get:
      tags: [智能分析]
      summary: 获取建议问题
      description: 返回预设的 AI 分析建议问题列表
      security:
        - bearerAuth: []
      responses:
        '200':
          description: 成功

  /api/chat-sessions:
    get:
      tags: [会话管理]
      summary: 获取会话列表
      description: 获取当前用户的所有对话会话
      security:
        - bearerAuth: []
      responses:
        '200':
          description: 成功
    post:
      tags: [会话管理]
      summary: 创建新会话
      security:
        - bearerAuth: []
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                title:
                  type: string
                  default: 新对话
                  description: 会话标题
      responses:
        '201':
          description: 创建成功

  /api/chat-sessions/{id}:
    delete:
      tags: [会话管理]
      summary: 删除会话
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
          description: 会话 ID
      responses:
        '200':
          description: 删除成功

  /api/chat-sessions/{id}/messages:
    get:
      tags: [会话管理]
      summary: 获取会话消息
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: 成功
    post:
      tags: [会话管理]
      summary: 添加消息
      description: 向会话添加新消息。如果是首条用户消息，系统会自动生成智能标题
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ChatMessage'
      responses:
        '201':
          description: 添加成功

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: JWT 令牌认证，有效期 24 小时

  schemas:
    User:
      type: object
      properties:
        id:
          type: integer
          description: 用户 ID
        username:
          type: string
          description: 用户名
        role:
          type: string
          enum: [admin, user]
          description: 用户角色

    LandUseSummary:
      type: object
      properties:
        class_code:
          type: integer
          description: 地类代码 (1-9)
        class_name:
          type: string
          description: 地类英文名称
        area_km2:
          type: number
          format: float
          description: 面积（平方公里）

    TransferMatrix:
      type: object
      properties:
        absoluteMatrix:
          type: array
          items:
            type: array
            items:
              type: number
          description: 绝对量转移矩阵
        percentageMatrix:
          type: array
          items:
            type: array
            items:
              type: number
          description: 百分比转移矩阵
        landTypes:
          type: array
          items:
            type: string
          description: 地类名称数组
        period:
          type: string
          description: 时间周期

    ChatMessage:
      type: object
      required: [role, content]
      properties:
        role:
          type: string
          enum: [user, assistant]
          description: 消息角色
        content:
          type: string
          description: 消息内容
